<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Money: the daily game for political junkies</title>
<meta name="description" content="The daily game for political junkies. Ten questions from live FEC filings, 90 seconds: can you read where the parties are really betting in 2026?">
<meta property="og:type" content="website">
<meta property="og:title" content="Smart Money: the daily game for political junkies">
<meta property="og:description" content="Think like the insiders. Ten questions from live FEC filings, 90 seconds, a new round every day. Bet your chips on where the parties are really spending.">
<meta property="og:url" content="https://follow-the-money-2026.netlify.app/smart-money/">
<meta property="og:image" content="https://follow-the-money-2026.netlify.app/smart-money/og-v2.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="627">
<meta name="twitter:card" content="summary_large_image">
<meta property="og:image:alt" content="Smart Money: the daily game for political junkies. Think like the insiders.">
<link rel="canonical" href="https://follow-the-money-2026.netlify.app/smart-money/">
<style>
:root{
  --bg:#fcfcfb;--panel:#fff;--ink:#1b1b1a;--ink2:#55554f;--muted:#8a8a82;--line:#e6e5e0;--line2:#f1f0ec;
  --dem:#2f6bd6;--rep:#d23c33;--ok:#1d7a4e;--ok-bg:#e6f4ec;--no:#a3470a;--no-bg:#fbeee3;--chip:#b8860b;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1a1a19;--panel:#222220;--ink:#eeede8;--ink2:#b7b6ae;--muted:#85847c;--line:#353531;--line2:#2a2a27;
  --dem:#5b93f0;--rep:#e5534b;--ok:#4cc38a;--ok-bg:#16301f;--no:#f0a060;--no-bg:#3a2616;--chip:#e0b84a;}}
:root[data-theme="dark"]{
  --bg:#1a1a19;--panel:#222220;--ink:#eeede8;--ink2:#b7b6ae;--muted:#85847c;--line:#353531;--line2:#2a2a27;
  --dem:#5b93f0;--rep:#e5534b;--ok:#4cc38a;--ok-bg:#16301f;--no:#f0a060;--no-bg:#3a2616;--chip:#e0b84a;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
h1{font-size:26px;letter-spacing:-.02em;margin:0}
.tag{color:var(--ink2);font-size:14px;margin:2px 0 0}
.num{font:13px var(--mono);color:var(--muted);white-space:nowrap}
.hdr-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.home{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 14px;font:600 13px var(--sans);cursor:pointer;min-height:32px}
.home:hover{border-color:var(--ink2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink2);margin-bottom:12px}
.chips{font:600 14px var(--mono);color:var(--chip)}
.progress{display:flex;gap:4px;margin-bottom:14px}
.progress i{flex:1;height:5px;border-radius:3px;background:var(--line2)}
.progress i.ok{background:var(--ok)}.progress i.no{background:var(--no)}.progress i.now{background:var(--ink2)}
.prompt{font-size:19px;line-height:1.4;font-weight:600;margin:0 0 16px}
.wager{display:flex;align-items:center;gap:8px;margin:0 0 14px;font-size:14px;color:var(--ink2);flex-wrap:wrap}
.wager button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 12px;font:600 14px var(--sans);cursor:pointer;min-width:44px;min-height:36px}
.wager button[aria-pressed="true"]{background:var(--chip);border-color:var(--chip);color:#1b1b1a}
.opts{display:grid;gap:10px}
.opt{width:100%;text-align:left;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:14px 16px;font:500 16px var(--sans);cursor:pointer;min-height:52px}
.opt:hover:not(:disabled){border-color:var(--ink2)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--no);background:var(--no-bg)}
.reveal{margin-top:16px;padding-top:14px;border-top:1px solid var(--line2)}
.verdict{font-weight:700;margin:0 0 6px}.verdict.ok{color:var(--ok)}.verdict.no{color:var(--no)}
.why{margin:0 0 10px;color:var(--ink2)}
details{font-size:14px;color:var(--ink2);margin-bottom:12px}
summary{cursor:pointer;color:var(--ink)}
.primary{display:block;width:100%;border:0;background:var(--ink);color:var(--bg);border-radius:12px;padding:14px;font:600 16px var(--sans);cursor:pointer;min-height:50px}
.secondary{display:block;width:100%;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:12px;font:600 15px var(--sans);cursor:pointer;margin-top:10px;text-align:center;text-decoration:none;min-height:48px}
.intro p{margin:0 0 12px;color:var(--ink2)}
.intro ol{padding-left:20px;margin:0 0 16px;color:var(--ink2)}
.score{font-size:44px;font-weight:700;letter-spacing:-.02em;margin:4px 0 0;color:var(--chip);font-variant-numeric:tabular-nums}
.rank{font-size:20px;font-weight:700;margin:0 0 12px}
.grid{font-size:24px;letter-spacing:2px;margin:6px 0 14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0;text-align:center}
.stats b{display:block;font-size:22px}
.stats span{font-size:12px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin-top:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;display:none}
.err{color:var(--no)}
footer{margin-top:22px;font-size:13px;color:var(--muted)}
#pop{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Smart Money</h1><p class="tag">Think like the insiders.</p></div>
    <div class="hdr-right"><span class="num" id="num"></span><button class="home" id="home" aria-label="Home: start screen">Home</button></div>
  </header>
  <main class="card" id="app" aria-live="polite"><p>Loading today's round…</p></main>
  <footer>Built on live FEC filings from the <a href="../">Follow the Money 2026 tracker</a>. New round every day at midnight Eastern. Nonpartisan: questions alternate between the parties.</footer>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="../learn.js"></script>
<script>
(() => {
const SITE = "https://follow-the-money-2026.netlify.app/smart-money/";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const RANKS = [[22, "Party Chair"], [14, "Campaign Manager"], [7, "Field Director"], [0, "Organizer"], [-99, "Intern"]];
const rankOf = c => RANKS.find(([min]) => c >= min)[1];
let P, st;

async function start() {
  try {
    P = await fetch(`../data/game/today.json?t=${Math.floor(Date.now() / 600000)}`).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
  } catch (e) {
    $("#app").innerHTML = `<p class="err">Today's round didn't load. Try again in a minute.</p>`;
    return;
  }
  $("#num").textContent = `#${P.number} · ${new Date(P.day + "T12:00").toLocaleDateString([], {month: "short", day: "numeric"})}`;
  st = store.get(`sm_${P.day}`, {i: 0, answers: [], wagers: [], done: false});
  $("#home").onclick = home;
  if (st.done) return end();
  if (st.i === 0 && !st.answers.length) return intro();
  question();
}

// Home: back to the start screen. Resume, start over, or replay; only the first finish counts toward stats.
function home() {
  if (!P) return;
  const started = st.answers.length > 0;
  if (!started) return intro();
  const buttons = st.done
    ? `<button class="primary" id="h1">See my result</button><button class="secondary" id="h2">Play again (practice)</button>`
    : `<button class="primary" id="h1">Resume at question ${st.i + 1}</button><button class="secondary" id="h2">Start over</button>`;
  $("#app").innerHTML = `<div class="intro">
    <p>${st.done ? "You've finished today's round." : `You're ${st.answers.length} of ${P.questions.length} questions in.`}
    ${st.done ? "Replays are for practice: your stats and streak keep your first score." : "Starting over clears this round's answers."}</p>
    ${buttons}</div>`;
  $("#h1").onclick = st.done ? end : question;
  $("#h2").onclick = () => {
    st = {i: 0, answers: [], wagers: [], done: false, replay: st.done || !!st.replay};
    store.set(`sm_${P.day}`, st);
    question();
  };
}

function intro() {
  $("#app").innerHTML = `<div class="intro">
    <p>Parties and big groups don't spend on hope. Where their money goes shows what their private polling says. Ten questions, all from real 2026 filings.</p>
    <ol><li><b>Bet 1 to 3 chips</b> on each answer, depending on how sure you are.</li>
    <li>Right wins the chips; wrong loses them.</li>
    <li>Every answer explains the rule or the race behind it.</li></ol>
    <button class="primary" id="go">Play today's round</button></div>`;
  $("#go").onclick = question;
}

function chipsNow() {
  return st.answers.reduce((s, a, i) => s + (a === P.questions[i].answer ? st.wagers[i] : -st.wagers[i]), 0);
}

function progress() {
  return `<div class="progress" aria-hidden="true">${P.questions.map((q, i) =>
    `<i class="${i < st.answers.length ? (st.answers[i] === q.answer ? "ok" : "no") : i === st.i ? "now" : ""}"></i>`).join("")}</div>`;
}

function question() {
  const q = P.questions[st.i];
  let wager = 2;
  $("#app").innerHTML = `${progress()}
    <div class="bar"><span>Question ${st.i + 1} of ${P.questions.length}</span><span class="chips">${fmtChips(chipsNow())} chips</span></div>
    <p class="prompt">${esc(q.prompt)}</p>
    <div class="wager" role="group" aria-label="Chips to bet">Your bet:
      ${[1, 2, 3].map(n => `<button data-w="${n}" aria-pressed="${n === wager}">${n}</button>`).join("")}</div>
    <div class="opts">${q.options.map((o, i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")}</div>
    <div id="reveal"></div>`;
  $(".wager").onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    wager = +b.dataset.w;
    $(".wager").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
  };
  $(".opts").onclick = e => {
    const b = e.target.closest(".opt"); if (!b) return;
    answer(+b.dataset.i, wager);
  };
}

function answer(pick, wager) {
  const q = P.questions[st.i];
  const right = pick === q.answer;
  st.answers.push(pick); st.wagers.push(wager);
  document.querySelectorAll(".opt").forEach((b, i) => {
    b.disabled = true;
    if (i === q.answer) b.classList.add("right");
    else if (i === pick) b.classList.add("wrong");
  });
  document.querySelectorAll(".wager button").forEach(b => b.disabled = true);
  $(".chips").textContent = `${fmtChips(chipsNow())} chips`;
  const g = (window.GLOSSARY || {})[q.glossary];
  const last = st.i === P.questions.length - 1;
  $("#reveal").innerHTML = `<div class="reveal">
    <p class="verdict ${right ? "ok" : "no"}">${right ? `Right. +${wager}` : `Not quite. −${wager}`}</p>
    <p class="why">${esc(q.why)}</p>
    ${g ? `<details><summary>Learn: ${esc(g.t)}</summary><p>${esc(g.d)}</p></details>` : ""}
    ${q.race_id ? `<p class="note" style="margin-top:0"><a href="../#race=${encodeURIComponent(q.race_id)}" target="_blank" rel="noopener">See this race in the tracker</a></p>` : ""}
    <button class="primary" id="next">${last ? "See my score" : "Next question"}</button></div>`;
  st.i += 1;
  if (last) st.done = true;
  store.set(`sm_${P.day}`, st);
  if (last) recordStats();
  $("#next").onclick = last ? end : question;
  $("#next").focus({preventScroll: true});
}

function recordStats() {
  const s = store.get("sm_stats", {played: 0, streak: 0, best: null, last: null});
  if (s.last === P.day) return;
  const yesterday = new Date(new Date(P.day + "T12:00") - 864e5).toISOString().slice(0, 10);
  s.streak = s.last === yesterday ? s.streak + 1 : 1;
  s.played += 1; s.last = P.day;
  const c = chipsNow();
  s.best = s.best == null ? c : Math.max(s.best, c);
  store.set("sm_stats", s);
}

const fmtChips = c => (c > 0 ? "+" : c < 0 ? "−" : "") + Math.abs(c);

function shareText() {
  const c = chipsNow();
  const grid = P.questions.map((q, i) => st.answers[i] === q.answer ? "🟩" : "🟧").join("");
  return `Smart Money #${P.number}${st.replay ? " (replay)" : ""}: ${rankOf(c)}\n${fmtChips(c)} chips\n${grid}\nThink like the insiders: ${SITE}`;
}

function end() {
  const c = chipsNow(), right = st.answers.filter((a, i) => a === P.questions[i].answer).length;
  const s = store.get("sm_stats", {played: 1, streak: 1, best: c});
  $("#app").innerHTML = `${progress()}
    <p class="num" style="margin:0">Today's result</p>
    <p class="score">${fmtChips(c)} chips</p>
    <p class="rank">${rankOf(c)} · ${right}/${P.questions.length} right</p>
    <div class="grid" aria-label="${right} of ${P.questions.length} right">${P.questions.map((q, i) => st.answers[i] === q.answer ? "🟩" : "🟧").join("")}</div>
    <button class="primary" id="li">Share on LinkedIn</button>
    <button class="secondary" id="copy">Copy my result</button>
    <a class="secondary" href="../">Explore the live tracker</a>
    <div class="stats"><div><b>${s.played}</b><span>played</span></div><div><b>${s.streak}</b><span>day streak</span></div><div><b>${fmtChips(s.best ?? c)}</b><span>best</span></div></div>
    <p class="note">Next round in <span id="cd"></span> (midnight Eastern). Ranks: Intern · Organizer (0+) · Field Director (7+) · Campaign Manager (14+) · Party Chair (22+).</p>`;
  $("#li").onclick = () => {
    copy(shareText(), false);
    window.open(`https://www.linkedin.com/feed/?shareActive=true&text=${encodeURIComponent(shareText())}`, "_blank", "noopener");
  };
  $("#copy").onclick = () => copy(shareText(), true);
  tick(); setInterval(tick, 1000);
}

function copy(text, notify) {
  const done = () => notify && toast("Copied. Paste it into a post.");
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, () => notify && toast("Couldn't copy; select the text manually."));
}

function toast(m) { const t = $("#toast"); t.textContent = m; t.style.display = "block"; setTimeout(() => t.style.display = "none", 2600); }

function tick() {
  const el = $("#cd"); if (!el) return;
  // next midnight in America/New_York
  const now = new Date();
  const et = new Date(now.toLocaleString("en-US", {timeZone: "America/New_York"}));
  const ms = (24 * 3600 - (et.getHours() * 3600 + et.getMinutes() * 60 + et.getSeconds())) * 1000;
  const h = Math.floor(ms / 36e5), m = Math.floor(ms % 36e5 / 6e4), sec = Math.floor(ms % 6e4 / 1e3);
  el.textContent = `${h}h ${String(m).padStart(2, "0")}m ${String(sec).padStart(2, "0")}s`;
}

start();
})();
</script>
</body>
</html>
