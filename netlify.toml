[build]
  publish = "site"
  command = ""

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The game moved from /play/ to /smart-money/; keep old links working.
[[redirects]]
  from = "/play/*"
  to = "/smart-money/"
  status = 301
